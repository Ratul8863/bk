<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BKSR loader preview</title>
    <style>
      :root {
        --bksr-navy: #173b6c;
        --bksr-red: #b83a3a;
        --font-serif: Georgia, 'Times New Roman', serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2ede3;
        font-family: system-ui, sans-serif;
        color: #17212b;
      }
      .wrap {
        text-align: center;
      }
      h1 {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #68727d;
        margin: 0 0 1.5rem;
      }
      .bksr-loader-svg {
        display: block;
        margin: 0 auto;
      }
      .bksr-loader-stroke {
        fill: none;
        stroke-dasharray: var(--bksr-dash);
        stroke-dashoffset: var(--bksr-dash);
        animation: bksr-loader-draw 2.4s ease-in-out infinite;
      }
      .bksr-loader-outer {
        --bksr-dash: 240;
      }
      .bksr-loader-cross {
        --bksr-dash: 168;
        animation-delay: 0.18s;
      }
      .bksr-loader-ring {
        --bksr-dash: 60;
        animation-delay: 0.36s;
      }
      .bksr-loader-letter {
        opacity: 0;
        animation: bksr-loader-letter 2.4s ease-in-out infinite;
      }
      .bksr-loader-letter-k {
        animation-delay: 0.45s;
      }
      .bksr-loader-letter-b {
        animation-delay: 0.55s;
      }
      .bksr-loader-letter-s {
        animation-delay: 0.65s;
      }
      .bksr-loader-letter-r {
        animation-delay: 0.75s;
      }
      @keyframes bksr-loader-draw {
        0% {
          stroke-dashoffset: var(--bksr-dash);
          opacity: 1;
        }
        35%,
        70% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        85%,
        100% {
          stroke-dashoffset: var(--bksr-dash);
          opacity: 0.35;
        }
      }
      @keyframes bksr-loader-letter {
        0%,
        18% {
          opacity: 0;
        }
        32%,
        70% {
          opacity: 1;
        }
        85%,
        100% {
          opacity: 0;
        }
      }
      p {
        margin: 1.25rem 0 0;
        font-size: 0.9rem;
        color: #68727d;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>BKSR loading animation</h1>
      <svg
        class="bksr-loader-svg"
        width="120"
        height="120"
        viewBox="0 0 100 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          class="bksr-loader-stroke bksr-loader-outer"
          d="M50 8 L92 50 L50 92 L8 50 Z"
          stroke="var(--bksr-navy)"
          stroke-width="1.75"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
        <path
          class="bksr-loader-stroke bksr-loader-cross"
          d="M50 8 L50 92 M8 50 L92 50"
          stroke="var(--bksr-navy)"
          stroke-width="1.35"
          stroke-linecap="round"
        />
        <text
          class="bksr-loader-letter bksr-loader-letter-k"
          x="50"
          y="28"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="var(--bksr-navy)"
          font-family="var(--font-serif)"
          font-size="13"
          font-weight="600"
        >
          K
        </text>
        <text
          class="bksr-loader-letter bksr-loader-letter-b"
          x="28"
          y="52"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="var(--bksr-navy)"
          font-family="var(--font-serif)"
          font-size="13"
          font-weight="600"
        >
          B
        </text>
        <text
          class="bksr-loader-letter bksr-loader-letter-s"
          x="72"
          y="52"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="var(--bksr-navy)"
          font-family="var(--font-serif)"
          font-size="13"
          font-weight="600"
        >
          S
        </text>
        <circle
          class="bksr-loader-stroke bksr-loader-ring"
          cx="50"
          cy="72"
          r="9.5"
          stroke="var(--bksr-navy)"
          stroke-width="1.5"
        />
        <text
          class="bksr-loader-letter bksr-loader-letter-r"
          x="50"
          y="73"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="var(--bksr-red)"
          font-family="var(--font-serif)"
          font-size="12"
          font-weight="700"
        >
          R
        </text>
      </svg>
      <p>Same stroke-draw loop as the reference GIF — BKSR mark instead of golf bag.</p>
    </div>
  </body>
</html>
